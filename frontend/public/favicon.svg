<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#20242B"/>
      <stop offset="0.55" stop-color="#14161B"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F38"/>
      <stop offset="0.5" stop-color="#1D2127"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B414C"/>
      <stop offset="1" stop-color="#1B1E24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ledGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="15" fill="url(#bgGlow)"/>

  <!-- Subtle HUD focus ring -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="#34D399" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="8.5" fill="none" stroke="#34D399" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Server rack: back plate (depth shadow) -->
  <rect x="17.5" y="9.5" width="29" height="45" rx="4.5" fill="#0E1013"/>

  <!-- Rack front face (centered on 32,32) -->
  <rect x="19" y="11" width="26" height="42" rx="4.5" fill="url(#edge)"/>
  <rect x="20.5" y="12.5" width="23" height="39" rx="3.5" fill="url(#face)"/>

  <!-- Rack units: 3 slots, 8px pitch -->
  <!-- Slot 1 -->
  <rect x="23.5" y="15.5" width="16.5" height="4" rx="2" fill="#101216"/>
  <rect x="25.5" y="16.3" width="9" height="2.4" rx="1.2" fill="url(#brand)"/>
  <circle cx="37" cy="17.5" r="1.5" fill="#34D399" filter="url(#ledGlow)"/>
  <!-- Slot 2 -->
  <rect x="23.5" y="23.5" width="16.5" height="4" rx="2" fill="#101216"/>
  <rect x="25.5" y="24.3" width="6" height="2.4" rx="1.2" fill="url(#led)"/>
  <circle cx="37" cy="25.5" r="1.5" fill="#0EA5E9" filter="url(#ledGlow)"/>
  <!-- Slot 3 -->
  <rect x="23.5" y="31.5" width="16.5" height="4" rx="2" fill="#101216"/>
  <rect x="25.5" y="32.3" width="11" height="2.4" rx="1.2" fill="url(#led)"/>
  <circle cx="37" cy="33.5" r="1.5" fill="#0EA5E9" filter="url(#ledGlow)"/>

  <!-- Central pulse (live telemetry heartbeat) -->
  <path d="M22 41 L26 41 L28.5 36.5 L31.5 44 L34.5 39 L38.5 39" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="38.5" cy="39" r="1.7" fill="#A7F3D0" filter="url(#ledGlow)"/>

  <!-- Top edge highlight -->
  <path d="M20.5 12.5 h21" stroke="#4A515D" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M21.5 13.5 h19" stroke="#2A2F38" stroke-width="1" stroke-linecap="round" opacity="0.9"/>

  <!-- Breathing status LEDs above the rack -->
  <circle cx="24" cy="8.5" r="1.3" fill="#34D399" opacity="0.9" filter="url(#glow)"/>
  <circle cx="28" cy="8.5" r="0.9" fill="#34D399" opacity="0.5"/>
</svg>
